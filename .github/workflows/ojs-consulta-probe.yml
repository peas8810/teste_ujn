name: Diagnose OJS public consultation forms
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ojs-consulta-probe.yml"
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe form response with HTTP requests
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,re
          from html.parser import HTMLParser
          class Forms(HTMLParser):
              def __init__(self): super().__init__();self.forms=[];self.cur=None
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag=="form": self.cur={"method":d.get("method","GET"),"action":d.get("action"),"inputs":[]};self.forms.append(self.cur)
                  if self.cur and tag in ("input","button","select"):self.cur["inputs"].append({"tag":tag,"type":d.get("type"),"name":d.get("name"),"value":(d.get("value") or "")[:45]})
              def handle_endtag(self,tag):
                  if tag=="form":self.cur=None
          for name,url in [("REMUNOM","https://remunom.ojsbr.com/multidisciplinar/declaracoes/consulta"),("RJNM","https://jrnm.ojsbr.com/juridica/declaracoes/consulta"),("RSV","https://rsv.ojsbr.com/rsv/declaracoes/consulta")]:
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36","Accept":"text/html,application/xhtml+xml"})
                  with urllib.request.urlopen(req,timeout=12) as x: raw=x.read(300000);status=x.status;target=x.url
                  parser=Forms();parser.feed(raw.decode("utf-8","replace"))
                  print(name,"http",status,"bytes",len(raw),"final_url",target,"forms",parser.forms[:3])
              except Exception as e:print(name,"http_error",str(e)[:140])
          PY
      - name: Probe browser navigation and form controls with Playwright
        run: |
          python -m pip -q install playwright
          python -m playwright install chromium --with-deps >/dev/null 2>&1
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          targets=[("REMUNOM","https://remunom.ojsbr.com/multidisciplinar/declaracoes/consulta"),("RJNM","https://jrnm.ojsbr.com/juridica/declaracoes/consulta"),("RSV","https://rsv.ojsbr.com/rsv/declaracoes/consulta")]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              for name,url in targets:
                  page=browser.new_page(locale="pt-BR",user_agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36",viewport={"width":1200,"height":900})
                  try:
                      response=page.goto(url,wait_until="domcontentloaded",timeout=22000)
                      page.wait_for_timeout(700)
                      controls=page.locator("form input, form select, form textarea, form button").evaluate_all("(nodes) => nodes.slice(0,45).map(x=>({tag:x.tagName.toLowerCase(),type:x.type,name:x.name,id:x.id,value:x.value?.slice(0,50),text:(x.innerText||'').slice(0,60)}))")
                      forms=page.locator("form").evaluate_all("(nodes)=>nodes.slice(0,6).map(x=>({action:x.action,method:x.method}))")
                      print(name,"browser_status",response.status if response else None,"title",page.title()[:60],"forms",forms,"controls",controls)
                  except Exception as e:print(name,"browser_error",str(e).split("\n")[0][:180])
                  page.close()
              browser.close()
          PY