<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atendimento IA | UJN Intelligence</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#17394a;background:#f3f7f8}*{box-sizing:border-box}body{margin:0}header{background:#122d43;color:white;padding:18px 24px;display:flex;justify-content:space-between;gap:15px;align-items:center}header small{color:#9ad5c7}main{max-width:1330px;padding:20px;margin:auto}.grid{display:grid;grid-template-columns:360px 1fr;gap:15px}.panel{background:#fff;border:1px solid #dce7e9;border-radius:13px;padding:18px}.list{max-height:70vh;overflow:auto}.item{display:block;width:100%;border:1px solid #e0e9eb;background:#fff;text-align:left;padding:14px;border-radius:10px;margin:8px 0;cursor:pointer}.item:hover,.item.active{background:#edf8f5;border-color:#47a590}.item small{display:block;color:#60818b;margin-top:4px}input,textarea,select{width:100%;padding:11px;border:1px solid #c8d7dc;border-radius:8px;margin:6px 0 12px;font:inherit}textarea{min-height:145px;resize:vertical}button{border:0;background:#147a69;color:#fff;border-radius:8px;padding:11px 15px;font-weight:700;cursor:pointer}button:disabled{opacity:.4;cursor:default}.sub{background:#e8f2f3;color:#214558}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.chip{padding:6px 10px;background:#edf2f4;border-radius:22px;font-size:12px}.muted{color:#607b85;font-size:13px;line-height:1.6}.bubble{background:#eff7f5;padding:14px;border-radius:9px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.error{color:#aa3636}#login{max-width:420px;margin:10vh auto}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.hidden{display:none!important}@media(max-width:850px){.grid{grid-template-columns:1fr}.list{max-height:320px}main{padding:10px}}</style></head><body>
<header><div><b>UJN Intelligence · Atendimento IA</b><small style="display:block">Central editorial das cinco revistas</small></div><div id="status">Acesso restrito</div></header>
<section id="login" class="panel"><h2>Entrar como operador</h2><p class="muted">Use seu acesso autorizado do Brain UJN.</p><form id="loginForm"><label>E-mail<input id="email" type="email" required></label><label>Senha<input id="password" type="password" required></label><button>Entrar</button></form><p class="error" id="loginError"></p></section>
<main id="app" class="hidden"><div class="top"><div><h2>Fila de mensagens</h2><p class="muted">Respostas automáticas, pendências e histórico de entregas.</p></div><div><button class="sub" id="refresh">Atualizar</button> <button class="sub" id="logout">Sair</button></div></div><div class="chips" id="stats"></div><div class="grid"><section class="panel"><select id="filter"><option value="">Todas as situações</option><option>ESCALATED</option><option>SENT</option><option>FAILED</option><option>DRAFT</option><option>READY</option><option>PROCESSING</option></select><div class="list" id="list"></div></section><section class="panel" id="detail"><p class="muted">Selecione uma mensagem.</p></section></div><p id="notice" class="muted"></p></main>
<script>
const BASE="https://leytqsyfrmzhectatcqm.supabase.co", PUB="sb_publishable_d4F4MVCCYDMNZw0VzOsCKQ_q7pHO7JH";
const E=x=>document.getElementById(x),state={token:null,rows:[],selected:null};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const date=s=>s?new Date(s).toLocaleString("pt-BR"):"—";
async function call(action,more={}){let r=await fetch("https://leytqsyfrmzhectatcqm.supabase.co/functions/v1/ujn-wa-ai-console",{method:"POST",headers:{authorization:"Bearer "+state.token,"content-type":"application/json"},body:JSON.stringify({action,...more})});let b=await r.json();if(!r.ok)throw Error(b.error||"Falha na operação");return b}
async function load(){let b=await call("list");state.rows=b.rows;let counts={};for(let x of b.rows)counts[x.state]=(counts[x.state]||0)+1;E("stats").innerHTML="<span class='chip'>Total "+b.rows.length+"</span>"+Object.entries(counts).map(([k,v])=>"<span class='chip'>"+esc(k)+": "+v+"</span>").join("");render()}
function render(){let f=E("filter").value;E("list").innerHTML=state.rows.filter(x=>!f||x.state===f).map(x=>"<button class='item "+(x.id===state.selected?"active":"")+"' data-id='"+esc(x.id)+"'><b>"+esc(x.phone_e164)+"</b><small>"+esc(x.intent)+" · "+esc(x.state)+" · "+date(x.created_at)+"</small><small>"+esc(x.inbound_body||"").slice(0,170)+"</small></button>").join("")||"<p class='muted'>Nenhuma mensagem encontrada.</p>";document.querySelectorAll(".item").forEach(n=>n.addEventListener("click",()=>{state.selected=n.dataset.id;render();detail()}))}
function detail(){let x=state.rows.find(x=>x.id===state.selected);if(!x){E("detail").innerHTML="<p class='muted'>Selecione uma mensagem.</p>";return}let allow=["ESCALATED","DRAFT"].includes(x.state);E("detail").innerHTML="<h3>Contato "+esc(x.phone_e164)+"</h3><div class='chips'><span class='chip'>"+esc(x.state)+"</span><span class='chip'>"+esc(x.journal_code||"Sem revista")+"</span><span class='chip'>Manuscrito "+esc(x.submission_id||"não confirmado")+"</span></div><p class='muted'>Mensagem recebida · "+date(x.received_at)+"</p><div class='bubble'>"+esc(x.inbound_body)+"</div><p class='muted'>Resposta proposta pela IA</p><textarea id='answer' "+(allow?"":"disabled")+">"+esc(x.answer)+"</textarea><p class='muted'>Fonte: "+esc(x.source_evidence?.source||"—")+" · Confiança: "+esc(x.confidence)+"</p><div class='chips'>"+(allow?"<button id='send'>Enviar resposta revisada</button>":"")+"<button class='sub' id='reload'>Atualizar</button></div><p class='muted'>ID da Meta: "+esc(x.provider_message_id||"—")+" · Erro: "+esc(x.error_code||"—")+"</p>";
E("reload").onclick=load;if(allow)E("send").onclick=async()=>{if(!confirm("Confirmar envio desta resposta pelo WhatsApp?"))return;E("send").disabled=true;try{let b=await call("manual_send",{id:x.id,text:E("answer").value});E("notice").textContent=b.accepted?"Resposta aceita pela Meta.":"Resposta não confirmada.";await load();detail()}catch(e){E("notice").textContent=e.message;await load();detail()}}}
E("loginForm").onsubmit=async ev=>{ev.preventDefault();E("loginError").textContent="";try{let r=await fetch(BASE+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:PUB,"content-type":"application/json"},body:JSON.stringify({email:E("email").value,password:E("password").value})});let b=await r.json();if(!r.ok||!b.access_token)throw Error("Credenciais inválidas");state.token=b.access_token;await load();E("login").classList.add("hidden");E("app").classList.remove("hidden");E("status").textContent="Operador autenticado"}catch(e){state.token=null;E("loginError").textContent=e.message}};
E("filter").onchange=render;E("refresh").onclick=load;E("logout").onclick=()=>{state.token=null;state.rows=[];E("app").classList.add("hidden");E("login").classList.remove("hidden");E("password").value=""};
</script></body></html>
